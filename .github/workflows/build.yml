name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load names from project.env
        run: |
          set -a; . ./project.env; set +a
          {
            echo "APK_NAME=$APK_NAME"
            echo "APP_NAME=$APP_NAME"
            echo "REPO_NAME=$REPO_NAME"
            echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Fixed debug keystore (every build installs as an update)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PappVersionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/${APK_NAME}-build-${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP_NAME }} build ${{ github.run_number }}
          body: Automatic debug build from commit ${{ env.SHORT_SHA }}
          files: dist/*.apk
          make_latest: true
