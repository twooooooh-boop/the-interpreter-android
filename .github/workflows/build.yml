name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load names from project.env
        run: |
          set -a; . ./project.env; set +a
          {
            echo "APK_NAME=$APK_NAME"
            echo "APP_NAME=$APP_NAME"
            echo "REPO_NAME=$REPO_NAME"
            echo "NTFY_TOPIC=$NTFY_TOPIC"
            echo "SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK platform and build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;34.0.0"

      - name: Prepare signing key (GitHub secret if set, otherwise keystore/ in the repo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the signing key from GitHub secrets"
          else
            echo "Using keystore/release.jks from the repo"
          fi

      - name: Unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease -PappVersionCode=${{ github.run_number }} 2>&1 | tee build.log

      - name: Collect and verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/${APK_NAME}-build-${{ github.run_number }}.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "dist/${APK_NAME}-build-${{ github.run_number }}.apk" | grep -E "Signer #1 certificate (DN|SHA-256)"
          ls -lh dist

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.APP_NAME }} build ${{ github.run_number }}
          body: Automatic release build from commit ${{ env.SHORT_SHA }}
          files: dist/*.apk
          make_latest: true

      - name: Notify - success
        if: success() && github.event_name != 'pull_request'
        run: |
          curl -s -H "Title: ${APP_NAME} build ${{ github.run_number }} succeeded" \
            -H "Tags: white_check_mark" \
            -H "Click: https://github.com/${{ github.repository }}/releases" \
            -d "Tap to open the release" "https://ntfy.sh/${NTFY_TOPIC}" || true

      - name: Notify - failure
        if: failure()
        run: |
          LINES=""
          if [ -f build.log ]; then
            LINES=$(grep -E -A2 "FAILURE:|What went wrong|error:|^e: " build.log | head -12)
          fi
          curl -s -H "Title: ${APP_NAME} build ${{ github.run_number }} FAILED" \
            -H "Priority: high" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "${LINES:-Open the run for details}" "https://ntfy.sh/${NTFY_TOPIC}" || true
