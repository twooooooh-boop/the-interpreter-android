name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets tag builds attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load names from project.env
        run: |
          set -a; . ./project.env; set +a
          {
            echo "APK_NAME=$APK_NAME"
            echo "REPO_NAME=$REPO_NAME"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK / NDK pieces love-android 11.5a needs
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "build-tools;33.0.1" "ndk;25.2.9519653"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project.env') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use the fixed debug keystore (every build installs as an update)
        run: |
          mkdir -p ~/.android
          cp android/debug.keystore ~/.android/debug.keystore

      - name: Generate Android project (love-android + game.love)
        env:
          VERSION_CODE_OVERRIDE: ${{ github.run_number }}
        run: bash scripts/prepare-android-project.sh

      - name: Build debug APK
        working-directory: android-project
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleEmbedNoRecordDebug

      - name: Collect APK
        run: |
          APK=$(find android-project/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/${APK_NAME}-debug.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
